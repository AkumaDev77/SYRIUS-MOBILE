<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8" />
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#1e1e2f" />

    <link rel="manifest" href="/static/manifest.json">

    <!-- Tema -->
    <meta name="theme-color" content="#1e1e2f" />

    <title>Syrius Mobile</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <!-- CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style/global/theme.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='style/components/navbar.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='style/pages/index.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='style/pages/bot.css') }}">
    <!-- Pages -->


</head>

<body>

    <!-- #region CONTEUDO DAS PAGINAS -->
    <div id="app">

        <main id="content">

            <!-- INDEX -->
            <section id="home-page" class="page active">

            </section>

            <!-- BOT -->
            <section id="bot-page" class="page">
                {% include 'pages/bot.html' %}
            </section>

            <!-- ANALYTICS -->
            <section id="analytic-page" class="page">

            </section>

            <!-- TAREFAS -->
            <section id="tarefas-page" class="page">
                ...
            </section>

            <!-- CARRO -->
            <section id="carro-page" class="page">
                ...
            </section>

           <!-- MAIS -->
            <section id="mais-page" class="page">
                ...
            </section>

        </main>
        <!-- #endregion -->

        <!-- #region BARRA DE NAVEGAÇÃO -->
        <nav class="navbar-mobile" id="navbarMobile">

            <button class="nav-item active" data-page="home-page">
                <i class="bi bi-house-fill"></i>
                <!-- <span>Home</span> -->
            </button>

            <button class="nav-item" data-page="bot-page">
                <i class="fa-solid fa-robot"></i>
                <!-- <span>Analytics</span> -->
            </button>

            <button class="nav-item" data-page="analytic-page">
                <i class="bi bi-graph-up"></i>
                <!-- <span>Relatórios</span> -->
            </button>

            <button class="nav-item" data-page="tarefas-page">
                <i class="fa-solid fa-list-check"></i>
                <!-- <span>Relatórios</span> -->
            </button>


            <button class="nav-item" data-page="carro-page">
                <i class="fa-solid fa-car-side"></i>
                <!-- <span>Relatórios</span> -->
            </button>

            <button class="nav-item" data-page="mais-page">
                <i class="bi bi-grid"></i>
                <!-- <span>Mais</span> -->
            </button>

        </nav>
        <!-- #endregion -->

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

    <script src="{{ url_for('static', filename='script/components/navbar.js') }}"></script>
    <script src="{{ url_for('static', filename='script/pages/bot.js') }}"></script>

    <script>
        if ("serviceWorker" in navigator) {
            navigator.serviceWorker.register("/static/service-worker.js");
        }
    </script>


</body>

</html>
